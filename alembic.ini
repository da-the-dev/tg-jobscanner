[alembic]
script_location = src/jobscan/migrations

# Dev-only default target — the app itself never reads this file; it builds
# its own Config at runtime pointing at whatever db_path is set in config.yaml
# (see jobscan.db._ensure_schema). Point this at a scratch/dev db before
# running `alembic revision --autogenerate` so it diffs against something
# expendable, not your real jobscan.db.
sqlalchemy.url = sqlite:///jobscan.db
