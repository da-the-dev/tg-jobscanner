# Copy to config.yaml and fill in. config.yaml is gitignored — keep secrets there.

# "web": scrape t.me/s/<channel> previews — PUBLIC channels only, no account,
#        no credentials, no login. Recommended start.
# "mtproto": full client via your own account — needed for private channels.
#            Requires api_id/api_hash from https://my.telegram.org + one login.
fetch_mode: "web"

telegram:                          # only needed for fetch_mode: mtproto
  api_id: ${TELEGRAM_API_ID}       # from https://my.telegram.org -> API development tools
  api_hash: "${TELEGRAM_API_HASH}"
  session: "jobscan"               # session file name (created by `python -m jobscan login`)

# Channel usernames or t.me links. Run `python -m jobscan channels` to list yours.
channels:
  - "some_it_jobs_channel"
  - "https://t.me/another_jobs_channel"

backfill:                  # limits for the FIRST scan of each channel
  days: 30                 # don't go further back than this…
  max_messages: 100        # …and never more than this many messages per channel

prefilter:                 # zero-cost filter before any LLM call
  min_length: 80
  # Message must contain at least one of these (your stack / role words, RU+EN).
  # Empty list [] disables this check (only generic job-signal filtering applies).
  my_keywords: ["python", "backend", "разработчик", "developer"]
  # Postings the LLM extracts as hiring at these levels get a visible ⚠ flag
  # and are dimmed on the dashboard (never hidden — a misfire stays easy to spot).
  reject_seniority: ["middle"]
  # Flag postings that explicitly require being physically based in Russia
  # (tax residency, ИП, "только из РФ"). Silent-on-location postings pass.
  reject_russia_only: true

links:                     # follow "apply"/"read more" links for extra JD context
  enabled: true
  fetch_timeout: 10        # seconds per link fetch
  max_fetches_per_run: 60  # new fetches per `jobscan run` (cache covers reruns/dupes)
  skip_fetch_min_chars: 400  # don't bother if the TG message is already a full JD
  recruiter_bonus: 8       # score bump when the apply link is a personal TG contact
                           # rather than a form/ATS — you report a higher conversion rate on these

llm:
  # === PICK ONE ===
  #   "openai"      -> any OpenAI-compatible endpoint. OpenRouter (below) is the
  #                    recommended default — pay-per-token, nothing to install.
  #                    The same backend also works with a self-hosted Ollama /
  #                    vLLM / LM Studio server: just point `host` at it.
  #   "claude-code" -> Claude via a Claude Code subscription (no per-token cost)
  backend: "openai"
  batch_size: 5            # postings per LLM call (higher = fewer calls = cheaper)
  concurrency: 4           # batches scored in parallel. 4-6 is good for a hosted
                           # endpoint; drop to 1 for a single local GPU.
  output_language: "en"    # "en" or "ru" — language of the analysis in the dashboard

  # --- 1. OpenAI-compatible endpoint (used only when backend: openai) ---
  # Recommended: OpenRouter — requires OPENROUTER_API_KEY in the environment.
  openai:
    host: "https://openrouter.ai/api/v1"
    model: "deepseek/deepseek-chat"   # any id from https://openrouter.ai/models
    api_key_env: "OPENROUTER_API_KEY"  # which env var holds the key
    # To use a self-hosted server instead, point host at it — most don't check
    # the key at all, so api_key_env can be left unset:
    # host: "http://localhost:11434/v1"   # Ollama's OpenAI-compatible endpoint
    # model: "qwen2.5:14b"                # must be pulled first: `ollama pull qwen2.5:14b`

  # --- 2. Claude subscription (used only when backend: claude-code) ---
  claude_code:
    command: "claude"      # path to the claude CLI if not on PATH
    model: ""              # "" = plan default; "haiku" = cheapest; "sonnet" = best
    use_subscription: true # strips ANTHROPIC_API_KEY/AUTH_TOKEN so the CLI uses
                           # your subscription login (prevents the 401). Set false
                           # only if you deliberately want CLI API-key auth.

scoring:
  min_score: 40            # dashboard's default "min score" filter value

serve:                     # `jobscan serve` — dashboard that writes status back to the DB
  host: "127.0.0.1"        # loopback only; the API has no auth
  port: 8765

resume_path: "resume.md"
db_path: "jobscan.db"
dashboard_path: "dashboard.html"
