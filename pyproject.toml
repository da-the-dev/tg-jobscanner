[project]
name = "telegram-jobscan"
version = "0.1.0"
description = "Scan Telegram job channels and rank postings against your resume"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.115",
    "openai>=3.10.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
    "telethon>=1.44.0",  # only needed for fetch_mode: mtproto
    "uvicorn>=0.32",
]

[project.scripts]
jobscan = "jobscan.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobscan"]

[dependency-groups]
test = [
    "pytest>=9.1.1",
]
