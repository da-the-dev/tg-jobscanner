<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Job Scan Dashboard</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --border:#2a2e38; --fg:#e6e6e6; --dim:#9aa0ab;
          --green:#4caf7d; --yellow:#d9a441; --red:#c75b5b; --accent:#5b8dd9;
          --purple:#9b7bd4; }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px; background:var(--bg); color:var(--fg);
         font:14px/1.45 -apple-system,'Segoe UI',Roboto,sans-serif; }
  h1 { font-size:20px; margin:0 0 4px; }
  .meta { color:var(--dim); margin-bottom:16px; font-size:12px; }
  .controls { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:10px; align-items:center; }
  input,select,textarea { background:var(--card); color:var(--fg); border:1px solid var(--border);
                 border-radius:6px; padding:6px 10px; font-size:13px; font-family:inherit; }
  input[type=search]{ width:260px; }
  label { color:var(--dim); font-size:12px; }
  button { background:var(--card); color:var(--fg); border:1px solid var(--border);
           border-radius:6px; padding:6px 12px; font-size:13px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  .pills { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .pill { border:1px solid var(--border); background:var(--card); color:var(--dim);
          border-radius:999px; padding:4px 12px; font-size:12px; cursor:pointer; user-select:none; }
  .pill:hover { color:var(--fg); }
  .pill.on { color:var(--fg); border-color:var(--accent); background:#1e2532; }
  .pill b { font-weight:600; }
  .pill .n { color:var(--dim); margin-left:5px; font-size:11px; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; padding:8px 10px; color:var(--dim); font-size:12px; cursor:pointer;
       border-bottom:1px solid var(--border); white-space:nowrap; user-select:none; }
  th:hover { color:var(--fg); }
  td { padding:10px; border-bottom:1px solid var(--border); vertical-align:top; }
  tr.row { cursor:pointer; }
  tr.row:hover { background:var(--card); }
  .score { font-weight:700; font-size:15px; }
  .bar { height:4px; border-radius:2px; background:var(--border); width:64px; margin-top:4px; }
  .bar>div { height:100%; border-radius:2px; }
  .title { font-weight:600; }
  .company { color:var(--dim); font-size:12px; }
  .tag { display:inline-block; background:var(--card); border:1px solid var(--border);
         border-radius:4px; padding:1px 7px; font-size:11px; color:var(--dim); margin-right:4px; }
  a.gobtn { color:var(--accent); text-decoration:none; font-size:13px; white-space:nowrap; }
  a.gobtn:hover { text-decoration:underline; }
  .detail { display:none; background:var(--card); }
  .detail.open { display:table-row; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:6px 4px; }
  .cols h4 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  .cols ul { margin:0; padding-left:18px; }
  .cols li { margin-bottom:4px; }
  .apply h4 { color:var(--green); } .skip h4 { color:var(--red); }
  .strong h4 { color:var(--green); } .weak h4 { color:var(--yellow); }
  .track { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:10px 4px 4px;
           border-top:1px solid var(--border); margin-top:8px; }
  .track h4 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.05em;
              color:var(--dim); }
  .track textarea { width:100%; min-height:56px; resize:vertical; }
  .hist { margin:0; padding:0; list-style:none; font-size:12px; color:var(--dim); }
  .hist li { margin-bottom:3px; }
  .hist .when { color:var(--dim); opacity:.75; margin-right:6px; }
  .notemark { color:var(--yellow); font-size:11px; }
  select.st { font-weight:600; }
  .s-new { color:var(--accent); } .s-applied { color:var(--green); }
  .s-interviewing { color:var(--purple); } .s-offer { color:var(--green); }
  .s-rejected { color:var(--red); } .s-skipped { color:var(--dim); }
  .s-maybe { color:var(--yellow); }
  tr.dim-row { opacity:.45; }
  .flag-tag { border-color:var(--yellow); color:var(--yellow); }
  .contact-tag { border-color:var(--green); color:var(--green); }
  .empty { color:var(--dim); padding:40px; text-align:center; }
  .banner { display:none; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;
            padding:8px 12px; border-radius:6px; border:1px solid var(--border);
            background:var(--card); font-size:12px; }
  .banner.show { display:flex; }
  .banner.warn { border-color:var(--yellow); }
  .banner.err { border-color:var(--red); }
  .banner code { color:var(--fg); background:#0d0f13; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<h1>Job Scan Dashboard</h1>
<div class="meta">Generated __GENERATED__ · __COUNT__ relevant postings · click a row for analysis</div>
<div class="banner" id="banner"></div>
<div class="controls">
  <input type="search" id="q" placeholder="Search title / company / text…">
  <label>Min score <input type="number" id="minScore" value="__MIN_SCORE__" min="0" max="100" style="width:64px"></label>
  <select id="chan"><option value="">All channels</option></select>
</div>
<div class="pills" id="pills"></div>
<table>
  <thead><tr>
    <th data-k="score">Score</th><th data-k="title">Job</th><th data-k="salary">Salary</th>
    <th data-k="location">Location</th><th data-k="channel">Channel</th>
    <th data-k="date">Date</th><th data-k="status">Status</th><th></th>
  </tr></thead>
  <tbody id="tb"></tbody>
</table>
<div class="empty" id="empty" style="display:none">Nothing matches the current filters.</div>
<script>
const DATA = __DATA__;
const STATUSES = __STATUSES__;
const LIVE = __LIVE__;                     // true when served by `jobscan serve`
const DEFAULT_API = __API__;
const QKEY = 'jobscan:queue', AKEY = 'jobscan:api';
const read=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
let apiBase = LIVE ? '' : (read(AKEY) || DEFAULT_API);
let filter = 'open', sortKey='score', sortDir=-1;

const tb=document.getElementById('tb'), q=document.getElementById('q'),
      minScore=document.getElementById('minScore'), chanSel=document.getElementById('chan'),
      pills=document.getElementById('pills'), banner=document.getElementById('banner');
const byHash = Object.fromEntries(DATA.map(d=>[d.hash,d]));
[...new Set(DATA.map(d=>d.channel))].sort().forEach(c=>{
  const o=document.createElement('option'); o.value=o.textContent=c; chanSel.appendChild(o);});

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function color(s){return s>=70?'var(--green)':s>=45?'var(--yellow)':'var(--red)';}
function list(items){return items&&items.length?'<ul>'+items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>':'<span style="color:var(--dim)">—</span>';}
function now(){return new Date().toISOString().slice(0,19).replace('T',' ');}

/* ---------- pending-change queue (offline / static-file mode) ---------- */
const store=(k,v)=>{try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const loadQueue=()=>{try{return JSON.parse(localStorage.getItem(QKEY))||[]}catch(e){return []}};
const saveQueue=x=>store(QKEY,JSON.stringify(x));
let queue = loadQueue();

/* One-time import of the pre-DB localStorage statuses, so nothing is lost. */
(function migrateLegacy(){
  const old=[];
  try{ for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
    if(k&&k.startsWith('jobstatus:')) old.push(k);} }catch(e){ return; }
  if(!old.length) return;
  old.forEach(k=>{const h=k.slice(10), v=localStorage.getItem(k);
    if(byHash[h] && STATUSES.includes(v) && v!=='new' && byHash[h].status==='new'){
      byHash[h].status=v; queue.push({hash:h,status:v,at:now()});}
    store(k,null);});
  saveQueue(queue);
})();

function setBanner(html, cls){
  banner.className='banner show'+(cls?' '+cls:''); banner.innerHTML=html;
}
function clearBanner(){ banner.className='banner'; banner.innerHTML=''; }
function showQueueState(err){
  if(!queue.length){ if(!LIVE&&!err) clearBanner(); return; }
  setBanner(`<span><b>${queue.length}</b> change${queue.length>1?'s':''} not saved to the database yet`
    +(err?` — ${esc(err)}`:'')+`. Run <code>jobscan serve</code>, then</span>`
    +` <button id="syncBtn">Sync now</button>`
    +` <input id="apiIn" style="width:200px" value="${esc(apiBase)}">`, err?'err':'warn');
  document.getElementById('syncBtn').onclick=()=>{
    apiBase=document.getElementById('apiIn').value.trim().replace(/\/$/,'');
    store(AKEY,apiBase); flush(true);};
}

async function flush(loud){
  if(!queue.length) return true;
  const batch=queue.slice();
  try{
    const r=await fetch(apiBase+'/api/status',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({changes:batch})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const res=await r.json();
    queue=queue.slice(batch.length); saveQueue(queue);
    (res.applied||[]).forEach(a=>{if(byHash[a.hash]) Object.assign(byHash[a.hash],a);});
    const bad=res.rejected||[];
    if(bad.length) setBanner(`${bad.length} change(s) refused: ${esc(bad[0].error||'?')}`,'err');
    else if(loud){ setBanner(`Saved ${res.applied.length} change${res.applied.length>1?'s':''} to the database.`);
      setTimeout(clearBanner,2500); }
    render();
    return true;
  }catch(e){
    showQueueState(loud?String(e.message||e):'');
    return false;
  }
}

/* ---------- writing a change ---------- */
function save(h, patch){
  const d=byHash[h]; if(!d) return;
  Object.assign(d, patch);
  d.status_updated=now();
  d.history=(d.history||[]).concat([{status:d.status,note:d.note||'',at:d.status_updated}]);
  queue.push(Object.assign({hash:h,at:d.status_updated},patch));
  saveQueue(queue);
  render();
  flush(false);
}

/* ---------- filtering / rendering ---------- */
const OPEN=['new','maybe','applied','interviewing','offer'];
function counts(){
  const c={all:DATA.length, open:0};
  STATUSES.forEach(s=>c[s]=0);
  DATA.forEach(d=>{c[d.status]=(c[d.status]||0)+1; if(OPEN.includes(d.status)) c.open++;});
  return c;
}
function renderPills(){
  const c=counts();
  const defs=[['all','All'],['open','Open'],...STATUSES.map(s=>[s,s])];
  pills.innerHTML=defs.map(([k,label])=>
    `<span class="pill ${k===filter?'on':''}" data-f="${k}"><b class="s-${k}">${esc(label)}</b>`
    +`<span class="n">${c[k]||0}</span></span>`).join('');
  pills.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{filter=p.dataset.f; render();});
}
function matchesFilter(d){
  if(filter==='all') return true;
  if(filter==='open') return OPEN.includes(d.status);
  return d.status===filter;
}
function render(){
  renderPills();
  const term=q.value.toLowerCase(), min=+minScore.value||0, ch=chanSel.value;
  let rows=DATA.filter(d=>matchesFilter(d) &&
    // never let the score/channel filters hide something you're already tracking
    (d.score>=min || d.status!=='new') && (!ch||d.channel===ch) &&
    (!term||(d.title+' '+d.company+' '+d.salary+' '+d.location+' '+(d.note||'')).toLowerCase().includes(term)));
  const idx=s=>STATUSES.indexOf(s);
  rows.sort((a,b)=>{
    const va=sortKey==='status'?idx(a.status):(a[sortKey]??''),
          vb=sortKey==='status'?idx(b.status):(b[sortKey]??'');
    return (typeof va==='number'?va-vb:String(va).localeCompare(String(vb)))*sortDir;});
  tb.innerHTML=rows.map(d=>{
    const st=d.status, flags=d.flags||[], dim=(st==='skipped'||st==='rejected'||flags.length>0);
    return `<tr class="row ${dim?'dim-row':''}" data-h="${d.hash}">
      <td><span class="score" style="color:${color(d.score)}">${d.score}</span>
          <div class="bar"><div style="width:${d.score}%;background:${color(d.score)}"></div></div></td>
      <td><div class="title">${esc(d.title)||'(untitled)'}</div><div class="company">${esc(d.company)}</div>
          ${flags.map(f=>`<span class="tag flag-tag">⚠ ${esc(f)}</span>`).join('')}
          ${d.contact_type==='recruiter_contact'?'<span class="tag contact-tag">📞 direct contact</span>':''}
          ${d.note?`<div class="notemark">✎ ${esc(d.note).slice(0,80)}</div>`:''}</td>
      <td>${esc(d.salary)||'—'}</td><td>${esc(d.location)||'—'}</td>
      <td><span class="tag">${esc(d.channel)}</span></td>
      <td style="white-space:nowrap">${(d.date||'').slice(0,10)}</td>
      <td><select class="st s-${st}" data-h="${d.hash}" onclick="event.stopPropagation()">
        ${STATUSES.map(s=>`<option ${s===st?'selected':''}>${s}</option>`).join('')}
      </select>${d.status_updated?`<div class="company">${esc(d.status_updated).slice(0,10)}</div>`:''}</td>
      <td><a class="gobtn" href="${esc(d.link)}" target="_blank" onclick="event.stopPropagation()">Open in TG ↗</a></td>
    </tr>
    <tr class="detail"><td colspan="8"><div class="cols">
      <div class="apply"><h4>Why apply</h4>${list(d.reasons_apply)}</div>
      <div class="skip"><h4>Why skip</h4>${list(d.reasons_skip)}</div>
      <div class="strong"><h4>Your strengths</h4>${list(d.strengths)}</div>
      <div class="weak"><h4>Your gaps</h4>${list(d.weaknesses)}</div>
    </div><div class="track">
      <div><h4>Note</h4><textarea class="note" data-h="${d.hash}"
        placeholder="Recruiter, referral, salary asked, rejection reason…"
        onclick="event.stopPropagation()">${esc(d.note||'')}</textarea></div>
      <div><h4>History</h4>${(d.history&&d.history.length)
        ? '<ul class="hist">'+d.history.map(h=>`<li><span class="when">${esc(h.at).slice(0,16)}</span>`
            +`<span class="s-${esc(h.status)}">${esc(h.status)}</span>`
            +`${h.note?' — '+esc(h.note):''}</li>`).join('')+'</ul>'
        : '<span style="color:var(--dim)">not tracked yet</span>'}</div>
    </div></td></tr>`;}).join('');
  document.getElementById('empty').style.display=rows.length?'none':'block';
  tb.querySelectorAll('tr.row').forEach(r=>r.addEventListener('click',
    ()=>r.nextElementSibling.classList.toggle('open')));
  tb.querySelectorAll('select.st').forEach(s=>s.addEventListener('change',
    e=>save(e.target.dataset.h,{status:e.target.value})));
  tb.querySelectorAll('textarea.note').forEach(t=>t.addEventListener('change',
    e=>{const d=byHash[e.target.dataset.h];
        if((d.note||'')!==e.target.value) save(e.target.dataset.h,{note:e.target.value});}));
  if(!LIVE) showQueueState();
}
document.querySelectorAll('th[data-k]').forEach(th=>th.addEventListener('click',()=>{
  const k=th.dataset.k; sortDir=(sortKey===k)?-sortDir:(k==='score'?-1:1); sortKey=k; render();}));
[q,minScore,chanSel].forEach(el=>el.addEventListener('input',render));
render();
if(queue.length) flush(false);   // a serve instance may be up since last time
</script>
</body>
</html>
